repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: block-patient-data
        name: Bloque les données patient réelles
        entry: python3 scripts/check_no_patient_data.py
        language: system
        pass_filenames: false
        always_run: true
