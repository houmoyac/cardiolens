[project]
name = "cardiolens"
version = "0.1.0"
description = "Moteur de mesure et d'interprétation assistée d'ECG (aide à la décision, non diagnostique)"
requires-python = ">=3.12"
dependencies = [
    "neurokit2>=0.2.10",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.36",
    "opencv-python-headless>=5.0.0.93",
    "scikit-learn>=1.4",
    "joblib>=1.4",
    "sqlmodel>=0.0.42",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "httpx>=0.27",
    "setuptools>=83.0.0",
]
# Only needed to re-run scripts/train_afib_model.py (downloads PTB-XL via
# wfdb) — not a runtime dependency of the app, kept out of the main group
# so the API/webapp/mobile backend doesn't carry it.
train = [
    "wfdb>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cardiolens"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# FastAPI's dependency injection deliberately uses Depends(...) as an
# argument default — the idiomatic pattern, not the mutable-default bug
# B008 exists to catch.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# Streamlit UI script — interface glue, not business logic; not
# meaningfully unit-testable without restructuring it into pure functions.
omit = ["src/cardiolens/webapp.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
]
