[project]
name = "cardiolens"
version = "0.1.0"
description = "Moteur de mesure et d'interprétation assistée d'ECG (aide à la décision, non diagnostique)"
requires-python = ">=3.12"
dependencies = [
    "neurokit2>=0.2.10",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.36",
    "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "httpx>=0.27",
    "setuptools>=83.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cardiolens"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# Streamlit UI script — interface glue, not business logic; not
# meaningfully unit-testable without restructuring it into pure functions.
omit = ["src/cardiolens/webapp.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
]
